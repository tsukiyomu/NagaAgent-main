[pytest]
testpaths = tests
addopts = -ra
markers =
    smoke: minimal critical API availability and response-contract checks
    blocking: deterministic contract eligible to block only when selected by an active CI gate
    integration: cooperation between multiple real in-repository components; external dependencies are controlled unless another profile marker says otherwise
    unit: deterministic unit- or component-level module and workflow/state-machine tests
    real_llm: opt-in profile using a real external LLM; non-blocking by default
    golden_case: deterministic scenario-level Agent Workflow contracts with scripted external dependencies
