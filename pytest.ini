[pytest]
testpaths = tests
addopts = -ra
markers =
    smoke: minimal P2 smoke coverage for gateway-facing APIs
    blocking: mandatory CI gate for PRs
    integration: external dependency required (agentserver/real upstream)
    unit: deterministic unit-level workflow/state-machine tests
    real_llm: opt-in real LLM smoke checks (non-blocking in v1 gate)
