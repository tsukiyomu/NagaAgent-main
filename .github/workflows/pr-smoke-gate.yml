name: PR Smoke Gate

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-smoke-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-blocking:
    name: Smoke Blocking Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install dependencies (project + test)
        run: uv sync --frozen --group test

      - name: Run smoke blocking tests
        run: >-
          uv run python -m pytest
          tests/smoke
          -m "smoke and blocking"
          -q
          --junitxml=tests/artifacts/closed_loop_v1/junit-smoke.xml

      - name: Upload smoke JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-loop-v1-smoke-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/artifacts/closed_loop_v1/junit-smoke.xml
          if-no-files-found: error
          retention-days: 14
